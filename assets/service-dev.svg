<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-dev-1" cx="60%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#176B5B" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#105044" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#202522" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#121513" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neon-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#20C997" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur-dev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#grad-dev-1)"/>
  <!-- Ambient light -->
  <circle cx="130" cy="140" r="120" fill="#20C997" opacity="0.35" filter="url(#blur-dev)"/>
  <circle cx="270" cy="270" r="100" fill="#FF922B" opacity="0.4" filter="url(#blur-dev)"/>
  <!-- Code Matrix / Poly geometry -->
  <g opacity="0.3" stroke="#FAF9F6" stroke-width="1.5" fill="none">
    <path d="M120 160 L80 200 L120 240" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M280 160 L320 200 L280 240" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="220" y1="140" x2="180" y2="260" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="60" stroke-dasharray="3 6"/>
    <circle cx="200" cy="200" r="85" stroke-dasharray="6 6"/>
  </g>
</svg>