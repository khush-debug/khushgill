<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-collab" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FD7E14" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#176B5B" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#202522" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#121513" stop-opacity="1"/>
    </radialGradient>
    <filter id="blur-collab" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#grad-collab)"/>
  <!-- Studio lighting flare -->
  <circle cx="200" cy="160" r="100" fill="#FFE066" opacity="0.4" filter="url(#blur-collab)"/>
  <circle cx="260" cy="250" r="80" fill="#176B5B" opacity="0.5" filter="url(#blur-collab)"/>
  <g opacity="0.35" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="160" cy="200" r="60"/>
    <circle cx="240" cy="200" r="60"/>
    <circle cx="200" cy="200" r="25" fill="#FFFFFF" fill-opacity="0.2"/>
    <path d="M140 280 Q200 320 260 280" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>