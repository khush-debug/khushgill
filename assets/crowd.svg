<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" class="crowd-illustration">
  <defs>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#D1D5DB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="clothDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <style>
    .stroke-ink { stroke: #09090b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-fine { stroke: #09090b; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .skin { fill: #F4F4F5; }
    .hair-dark { fill: #18181B; }
    .cloth-white { fill: #FFFFFF; }
    .cloth-dark { fill: url(#clothDark); stroke: #3F3F46; stroke-width: 1.5; }
    .cloth-stripe { fill: #E4E4E7; }
    .detail { stroke: #52525B; stroke-width: 1.2; stroke-linecap: round; }
  </style>

  <!-- Background People (Back layer) -->
  <g class="back-row" opacity="0.85">
    <!-- Person Back 1 (Left) -->
    <g transform="translate(60, 90)">
      <circle cx="50" cy="50" r="34" class="skin stroke-ink"/>
      <path d="M 22 45 Q 50 15 78 45 Q 65 30 50 30 Q 35 30 22 45 Z" class="hair-dark"/>
      <!-- Eyes & Smile -->
      <circle cx="40" cy="50" r="2.5" fill="#09090b"/>
      <circle cx="60" cy="50" r="2.5" fill="#09090b"/>
      <path d="M 44 63 Q 50 68 56 63" class="stroke-fine" fill="none"/>
      <!-- Torso -->
      <path d="M 16 84 C 20 120 0 180 0 200 L 100 200 C 100 180 80 120 84 84 Z" class="cloth-dark"/>
    </g>

    <!-- Person Back 2 (Left-Mid) - Glasses -->
    <g transform="translate(190, 80)">
      <circle cx="50" cy="48" r="32" class="skin stroke-ink"/>
      <path d="M 20 40 Q 50 18 80 40 Q 60 25 50 25 Q 40 25 20 40 Z" class="hair-dark"/>
      <!-- Glasses -->
      <rect x="32" y="42" width="16" height="12" rx="3" fill="none" class="stroke-fine"/>
      <rect x="52" y="42" width="16" height="12" rx="3" fill="none" class="stroke-fine"/>
      <line x1="48" y1="48" x2="52" y2="48" class="stroke-fine"/>
      <path d="M 44 64 Q 50 69 56 64" class="stroke-fine" fill="none"/>
      <!-- Torso -->
      <path d="M 15 80 C 20 120 5 180 5 200 L 95 200 C 95 180 80 120 85 80 Z" class="cloth-white stroke-ink"/>
      <path d="M 50 80 L 50 140" class="stroke-fine"/>
    </g>

    <!-- Person Back 3 (Center-Left) - Turban/Beard Respectful Style -->
    <g transform="translate(330, 65)">
      <!-- Turban -->
      <path d="M 15 50 C 15 15 45 5 55 5 C 65 5 95 15 95 50 C 90 55 85 60 55 60 C 25 60 20 55 15 50 Z" class="cloth-white stroke-ink"/>
      <path d="M 25 35 Q 55 20 85 35" class="stroke-fine" fill="none"/>
      <!-- Face -->
      <path d="M 25 50 C 25 75 35 90 55 90 C 75 90 85 75 85 50 Z" class="skin stroke-ink"/>
      <!-- Beard -->
      <path d="M 30 65 C 30 92 45 105 55 105 C 65 105 80 92 80 65 C 75 75 65 78 55 78 C 45 78 35 75 30 65 Z" class="hair-dark"/>
      <!-- Eyes & Smile -->
      <circle cx="43" cy="58" r="2.5" fill="#09090b"/>
      <circle cx="67" cy="58" r="2.5" fill="#09090b"/>
      <path d="M 48 72 Q 55 76 62 72" class="stroke-fine" fill="none" stroke="#FFFFFF"/>
      <!-- Torso -->
      <path d="M 10 100 C 15 140 0 190 0 215 L 110 215 C 110 190 95 140 100 100 Z" class="cloth-stripe stroke-ink"/>
    </g>

    <!-- Person Back 4 (Center-Right) -->
    <g transform="translate(680, 70)">
      <circle cx="50" cy="50" r="33" class="skin stroke-ink"/>
      <path d="M 18 42 C 25 15 75 15 82 42 C 70 28 50 25 18 42 Z" class="hair-dark"/>
      <circle cx="40" cy="52" r="2.5" fill="#09090b"/>
      <circle cx="60" cy="52" r="2.5" fill="#09090b"/>
      <path d="M 44 65 Q 50 71 56 65" class="stroke-fine" fill="none"/>
      <!-- Torso -->
      <path d="M 14 83 C 20 120 5 180 5 210 L 95 210 C 95 180 80 120 86 83 Z" class="cloth-dark"/>
    </g>

    <!-- Person Back 5 (Far Right) -->
    <g transform="translate(830, 75)">
      <circle cx="50" cy="50" r="33" class="skin stroke-ink"/>
      <path d="M 20 48 Q 50 15 80 48 Q 65 30 50 30 Q 35 30 20 48 Z" class="hair-dark"/>
      <circle cx="42" cy="52" r="2.5" fill="#09090b"/>
      <circle cx="58" cy="52" r="2.5" fill="#09090b"/>
      <path d="M 45 66 Q 50 71 55 66" class="stroke-fine" fill="none"/>
      <!-- Torso -->
      <path d="M 15 83 C 20 125 0 185 0 205 L 100 205 C 100 185 80 125 85 83 Z" class="cloth-white stroke-ink"/>
    </g>

    <!-- Person Back 6 (Extreme Right) -->
    <g transform="translate(980, 85)">
      <circle cx="50" cy="50" r="34" class="skin stroke-ink"/>
      <path d="M 20 38 C 30 15 70 15 80 38 C 65 24 45 24 20 38 Z" class="hair-dark"/>
      <circle cx="40" cy="52" r="2.5" fill="#09090b"/>
      <circle cx="60" cy="52" r="2.5" fill="#09090b"/>
      <path d="M 44 66 Q 50 72 56 66" class="stroke-fine" fill="none"/>
      <path d="M 12 84 C 20 130 5 185 5 200 L 95 200 C 95 185 80 130 88 84 Z" class="cloth-dark"/>
    </g>
  </g>

  <!-- Mid & Foreground Layer People (Sharp, detailed, iconic) -->
  <g class="front-row">

    <!-- FRONT LEFT: Girl with curly hair smiling -->
    <g transform="translate(20, 110)">
      <!-- Curly Hair Background -->
      <ellipse cx="65" cy="65" rx="46" ry="46" class="hair-dark"/>
      <!-- Face -->
      <circle cx="65" cy="72" r="32" class="skin stroke-ink"/>
      <!-- Fringe -->
      <path d="M 36 58 Q 50 44 68 48 Q 80 44 94 60 C 85 54 75 52 65 52 C 50 52 42 55 36 58 Z" class="hair-dark"/>
      <!-- Eyes, Brows, Smile -->
      <path d="M 48 65 Q 54 62 60 65" class="stroke-fine" fill="none"/>
      <path d="M 70 65 Q 76 62 82 65" class="stroke-fine" fill="none"/>
      <circle cx="54" cy="70" r="3" fill="#09090b"/>
      <circle cx="76" cy="70" r="3" fill="#09090b"/>
      <path d="M 65 72 L 64 78" class="stroke-fine"/>
      <path d="M 54 84 Q 65 94 76 84 Z" fill="#E11D48" class="stroke-fine"/>
      <path d="M 56 84 Q 65 88 74 84" fill="#FFFFFF"/>
      <!-- Torso -->
      <path d="M 28 104 C 35 140 10 200 5 250 L 125 250 C 120 200 95 140 102 104 Z" class="cloth-white stroke-ink"/>
      <path d="M 45 104 C 55 125 75 125 85 104" class="stroke-fine" fill="none"/>
      <!-- Flower / Earring -->
      <circle cx="32" cy="78" r="3.5" fill="#E4E4E7" class="stroke-fine"/>
    </g>

    <!-- FRONT MID-LEFT: Young Woman waving hand -->
    <g transform="translate(130, 115)">
      <!-- Hair -->
      <path d="M 40 45 C 40 20 85 20 90 45 C 105 70 105 110 100 130 C 85 110 88 85 88 70 C 85 60 45 60 42 70 C 42 85 45 110 30 130 C 25 110 25 70 40 45 Z" class="hair-dark"/>
      <!-- Face -->
      <circle cx="65" cy="70" r="30" class="skin stroke-ink"/>
      <!-- Bangs -->
      <path d="M 40 58 Q 65 48 90 58 Q 80 50 65 50 Q 50 50 40 58 Z" class="hair-dark"/>
      <!-- Eyes & Bright smile -->
      <circle cx="53" cy="68" r="2.8" fill="#09090b"/>
      <circle cx="77" cy="68" r="2.8" fill="#09090b"/>
      <path d="M 55 81 Q 65 91 75 81 Z" fill="#09090b"/>
      <!-- Torso -->
      <path d="M 30 100 C 35 140 15 200 10 245 L 120 245 C 115 200 95 140 100 100 Z" class="cloth-stripe stroke-ink"/>
      <path d="M 65 100 L 65 245" class="stroke-fine"/>
    </g>

    <!-- FRONT INNER-LEFT: Professional man smiling -->
    <g transform="translate(260, 105)">
      <!-- Short stylish hair -->
      <path d="M 32 50 C 32 20 88 20 88 50 C 88 40 80 32 60 32 C 40 32 32 40 32 50 Z" class="hair-dark"/>
      <!-- Face -->
      <path d="M 34 50 C 34 80 44 92 60 92 C 76 92 86 80 86 50 Z" class="skin stroke-ink"/>
      <!-- Eyes, glasses -->
      <circle cx="48" cy="60" r="2.5" fill="#09090b"/>
      <circle cx="72" cy="60" r="2.5" fill="#09090b"/>
      <path d="M 52 75 Q 60 82 68 75" class="stroke-fine" fill="none"/>
      <!-- Torso with collar -->
      <path d="M 20 95 C 25 135 5 195 0 255 L 120 255 C 115 195 95 135 100 95 Z" class="cloth-dark"/>
      <!-- Collar -->
      <path d="M 48 95 L 60 115 L 72 95 Z" class="cloth-white stroke-fine"/>
    </g>

    <!-- CENTER HERO: THE MAIN CHARACTER (Protagonist / Representation) standing tall -->
    <g transform="translate(480, 50)" id="center-protagonist">
      <!-- High crafted central figure as seen in the video frame 00:18 -->
      <!-- Hair: neat modern textured wave -->
      <path d="M 35 48 C 30 15 80 8 95 35 C 102 45 98 60 95 65 C 90 50 85 40 65 38 C 45 36 38 42 35 48 Z" class="hair-dark stroke-ink"/>
      <!-- Face -->
      <path d="M 40 46 C 40 85 50 96 66 96 C 82 96 92 85 92 46 Z" class="skin stroke-ink"/>
      <!-- Eyebrows -->
      <path d="M 47 50 Q 56 46 62 50" class="stroke-ink" fill="none"/>
      <path d="M 70 50 Q 76 46 85 50" class="stroke-ink" fill="none"/>
      <!-- Expressive eyes -->
      <circle cx="55" cy="58" r="3.2" fill="#09090b"/>
      <circle cx="77" cy="58" r="3.2" fill="#09090b"/>
      <!-- Nose bridge -->
      <path d="M 66 54 L 64 68 L 69 70" class="stroke-fine" fill="none"/>
      <!-- Warm, confident smile -->
      <path d="M 54 78 Q 66 90 78 78 Z" fill="#09090b" class="stroke-fine"/>
      <path d="M 56 78 Q 66 84 76 78" fill="#FFFFFF"/>
      <!-- Ears -->
      <path d="M 40 56 Q 34 62 40 70" class="stroke-fine" fill="#F4F4F5"/>
      <path d="M 92 56 Q 98 62 92 70" class="stroke-fine" fill="#F4F4F5"/>
      <!-- Neck -->
      <path d="M 54 94 L 54 112 L 78 112 L 78 94" class="skin stroke-ink"/>
      <!-- Modern Black Polo / Shirt -->
      <path d="M 22 112 C 30 150 15 240 10 310 L 122 310 C 117 240 102 150 110 112 Z" class="cloth-dark"/>
      <!-- Polo collar & placket -->
      <path d="M 50 112 L 66 134 L 82 112" class="stroke-ink" fill="#27272A"/>
      <path d="M 66 134 L 66 185" class="stroke-fine"/>
      <circle cx="66" cy="148" r="2" fill="#FFFFFF"/>
      <circle cx="66" cy="164" r="2" fill="#FFFFFF"/>
    </g>

    <!-- FRONT INNER-RIGHT: Cheerful girl waving hand -->
    <g transform="translate(620, 95)">
      <!-- Waving Hand -->
      <g transform="translate(90, 30) rotate(15)">
        <path d="M 10 30 C 10 15 15 5 22 5 C 28 5 28 15 28 20 C 32 15 36 12 40 16 C 44 20 40 28 38 35 C 44 32 48 35 46 42 C 44 48 35 60 25 65 Z" class="skin stroke-ink"/>
        <path d="M 18 60 L 10 90 L 32 90 L 28 65" class="cloth-white stroke-ink"/>
      </g>
      <!-- Hair: high ponytail / twin tufts -->
      <path d="M 35 48 C 25 15 85 10 95 40 C 105 75 100 120 95 135 C 85 100 85 70 85 55 C 80 45 45 45 40 55 C 40 70 40 100 30 135 C 25 120 25 75 35 48 Z" class="hair-dark"/>
      <!-- Face -->
      <circle cx="65" cy="68" r="30" class="skin stroke-ink"/>
      <!-- Eyes -->
      <circle cx="53" cy="65" r="3" fill="#09090b"/>
      <circle cx="77" cy="65" r="3" fill="#09090b"/>
      <path d="M 54 78 Q 65 92 76 78 Z" fill="#E11D48" class="stroke-fine"/>
      <!-- Torso -->
      <path d="M 28 98 C 35 140 15 200 10 265 L 120 265 C 115 200 95 140 102 98 Z" class="cloth-white stroke-ink"/>
      <path d="M 65 98 L 65 265" class="stroke-fine"/>
    </g>

    <!-- FRONT MID-RIGHT: Elder / Mentor with turban & warm smile -->
    <g transform="translate(750, 85)">
      <!-- Turban -->
      <path d="M 15 55 C 15 20 45 10 58 10 C 70 10 100 20 100 55 C 95 62 88 68 58 68 C 28 68 20 62 15 55 Z" class="cloth-dark stroke-ink"/>
      <path d="M 28 38 Q 58 24 88 38" class="stroke-fine" fill="none" stroke="#71717A"/>
      <!-- Face -->
      <path d="M 28 55 C 28 82 40 95 58 95 C 76 95 88 82 88 55 Z" class="skin stroke-ink"/>
      <!-- Full beard & mustache -->
      <path d="M 30 70 C 30 100 45 115 58 115 C 72 115 86 100 86 70 C 80 82 70 85 58 85 C 46 85 36 82 30 70 Z" class="hair-dark"/>
      <circle cx="46" cy="62" r="2.8" fill="#09090b"/>
      <circle cx="70" cy="62" r="2.8" fill="#09090b"/>
      <path d="M 52 76 Q 58 80 64 76" class="stroke-fine" fill="none" stroke="#FFFFFF"/>
      <!-- Torso Kurta -->
      <path d="M 10 105 C 18 145 0 210 0 275 L 115 275 C 115 210 98 145 105 105 Z" class="cloth-white stroke-ink"/>
      <path d="M 58 105 L 58 170" class="stroke-fine"/>
    </g>

    <!-- FRONT RIGHT: Young Creative / Tech Professional -->
    <g transform="translate(890, 95)">
      <!-- Stylish cropped hair -->
      <path d="M 32 45 C 32 15 88 15 88 45 C 80 32 65 30 50 30 C 38 30 32 36 32 45 Z" class="hair-dark"/>
      <circle cx="60" cy="65" r="30" class="skin stroke-ink"/>
      <circle cx="48" cy="62" r="2.8" fill="#09090b"/>
      <circle cx="72" cy="62" r="2.8" fill="#09090b"/>
      <path d="M 50 76 Q 60 84 70 76" class="stroke-fine" fill="none"/>
      <!-- Torso -->
      <path d="M 22 95 C 28 140 10 200 5 265 L 115 265 C 110 200 92 140 98 95 Z" class="cloth-dark"/>
      <path d="M 45 95 L 60 115 L 75 95" class="stroke-fine" fill="#3F3F46"/>
    </g>

    <!-- FRONT FAR RIGHT: Enthusiastic Woman -->
    <g transform="translate(1010, 105)">
      <!-- Long Hair -->
      <path d="M 35 45 C 35 15 90 15 90 45 C 105 75 105 130 95 155 C 85 120 85 85 85 65 C 80 50 45 50 40 65 C 40 85 40 120 30 155 C 20 130 20 75 35 45 Z" class="hair-dark"/>
      <circle cx="62" cy="68" r="30" class="skin stroke-ink"/>
      <circle cx="50" cy="65" r="2.8" fill="#09090b"/>
      <circle cx="74" cy="65" r="2.8" fill="#09090b"/>
      <path d="M 52 79 Q 62 90 72 79 Z" fill="#E11D48" class="stroke-fine"/>
      <!-- Torso -->
      <path d="M 25 98 C 32 140 10 205 5 255 L 120 255 C 115 205 92 140 100 98 Z" class="cloth-stripe stroke-ink"/>
    </g>

  </g>
</svg>