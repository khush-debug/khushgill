<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEON // Portal Field</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="webgl-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform float u_time;
      uniform vec2 u_resolution;
      uniform vec2 u_mouse;
      uniform vec3 u_colorCore;
      uniform vec3 u_colorFringe;
      uniform float u_isLightMode;
      varying vec2 vUv;

      vec2 hash( vec2 p ) {
        p = vec2( dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)) );
        return -1.0 + 2.0*fract(sin(p)*43758.5453123);
      }
      float noise( in vec2 p ) {
        const float K1 = 0.366025404;
        const float K2 = 0.211324865;
        vec2 i = floor( p + (p.x+p.y)*K1 );
        vec2 a = p - i + (i.x+i.y)*K2;
        vec2 o = (a.x>a.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
        vec2 b = a - o + K2;
        vec2 c = a - 1.0 + 2.0*K2;
        vec3 h = max( 0.5-vec3(dot(a,a), dot(b,b), dot(c,c) ), 0.0 );
        vec3 n = h*h*h*h*vec3( dot(a,hash(i+0.0)), dot(b,hash(i+o)), dot(c,hash(i+1.0)));
        return dot( n, vec3(70.0) );
      }

      float sdArc(vec2 p, vec2 center, float radius, float width, float warp) {
        p.y += sin(p.x * 2.0 + u_time * 0.3) * warp;
        p.x += noise(p * 1.5 + u_time * 0.1) * (warp * 0.8);
        float d = length(p - center) - radius;
        return abs(d) - width;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_resolution.xy;
        vec2 st = uv;
        st.x *= u_resolution.x / u_resolution.y;

        vec2 mouseOffset = (u_mouse - 0.5) * 0.05;
        st += mouseOffset;

        vec2 center = vec2(0.5, 0.5);

        float d1 = sdArc(st, center, 0.600, 0.0200, 0.15);
        float d2 = sdArc(st, center, 0.650, 0.0600, 0.2);

        float coreGlow = exp(-d1 * 30.0);
        float fringeGlow = exp(-d2 * 10.0);
        float wash = smoothstep(1.5, -0.5, length(st - center)) * 0.15;

        vec3 finalColor = vec3(0.0);
        finalColor += u_colorCore * coreGlow;
        finalColor += u_colorFringe * fringeGlow;
        finalColor += u_colorFringe * wash * (sin(u_time * 0.5) * 0.2 + 0.8);

        float alpha = clamp(coreGlow + fringeGlow + wash, 0.0, 1.0);
        finalColor = vec3(1.0) - exp(-finalColor * 1.5);

        gl_FragColor = vec4(finalColor, alpha * 0.85);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
        u_colorCore: { value: new THREE.Color('#FFFFFF') },
        u_colorFringe: { value: new THREE.Color('#38bdf8') },
        u_isLightMode: { value: 0.0 }
      },
      transparent: true,
      blending: THREE.AdditiveBlending
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    let targetMouse = new THREE.Vector2(0.5, 0.5);
    window.addEventListener('mousemove', (e) => {
      targetMouse.x = e.clientX / window.innerWidth;
      targetMouse.y = 1.0 - (e.clientY / window.innerHeight);
    });

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'portal-mouse') {
        targetMouse.x = event.data.x;
        targetMouse.y = event.data.y;
      }
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      material.uniforms.u_time.value = clock.getElapsedTime() * 1.0;
      material.uniforms.u_mouse.value.lerp(targetMouse, 0.05);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      material.uniforms.u_resolution.value.set(width, height);
    });
  </script>
</body>
</html>
